name: CI Pipeline
on: [push]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5
      - name: Install nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install dependencies
        working-directory: ./services/alert-ingestion
        run: npm ci
      - name: run tests
        working-directory: ./services/alert-ingestion
        run: npm run test
