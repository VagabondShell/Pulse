name: Quality Gates
on:
  push:
    branches:
      # - main
      - feat/ci-matrix
jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - "alert-ingestion"
          - "incident-management"
          - "on-call-service"
          - "web-ui"
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Debug - List files
        run: |
          echo "Current directory: $(pwd)"
          echo "Looking for: services/${{ matrix.service }}/package-lock.json"
          ls -l services/${{ matrix.service }}/package-lock.json || echo "File not found!"
      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: "services/${{ matrix.service }}/package-lock.json"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci
      - name: Generate Prisma Client
        working-directory: services/${{ matrix.service }}
        run: npx prisma generate
        continue-on-error: true
      - name: Run linter
        working-directory: services/${{ matrix.service }}
        run: npm run lint
      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: npm run test
      - name: Verify Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false  # Just verify it builds, don't push
          tags: pulse/${{ matrix.service }}:pr-test
