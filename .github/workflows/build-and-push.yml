name: Build, Scan and Push
on:
  push:
    branches:
      - feat/ci-build-push
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  Build-Push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - alert-ingestion
          - incident-management
          - on-call-service
          - web-ui

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Scan source code with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'services/${{ matrix.service }}'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'

    - name: Upload Trivy FS scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: trivy-fs-${{ matrix.service }}

    - name: Build Docker image locally
      uses: docker/build-push-action@v5
      with:
        context: services/${{ matrix.service }}
        push: false
        load: true
        tags: services/${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: services/${{ matrix.service }}:${{ github.sha }}
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        ignore-unfixed: true

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: services/${{ matrix.service }}
        push: true
        tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pulse-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pulse-${{ matrix.service }}:latest
        cache-from: type=gha,scope=${{ matrix.service }}
